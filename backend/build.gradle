// 사용할 플러그인 선언
plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.11'         // Spring Boot 프레임워크
	id 'io.spring.dependency-management' version '1.1.7'   // 의존성 버전 자동 관리
}

group = 'com.farmtech'
version = '0.0.1-SNAPSHOT'

// Java 17 버전 사용
java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

// lombok을 컴파일 전용으로 설정
configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

// 라이브러리 다운로드 위치 (Maven 중앙 저장소)
repositories {
	mavenCentral()
}

dependencies {
    // 토스페이먼츠 결제 sdk (현재 미사용)
    // implementation 'com.github.tosspayments:payment-sdk-android:0.1.15'

	// JWT 토큰 생성/검증 라이브러리
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// SQL 쿼리 로그 출력 라이브러리
	implementation 'org.bgee.log4jdbc-log4j2:log4jdbc-log4j2-jdbc4:1.16'

	// MyBatis에서 LocalDateTime 타입 사용을 위한 핸들러
	implementation("org.mybatis:mybatis-typehandlers-jsr310:1.0.2")

	// Spring Security (인증/인가)
	implementation 'org.springframework.boot:spring-boot-starter-security'

	// Spring Web (REST API)
	implementation 'org.springframework.boot:spring-boot-starter-web'

	// MyBatis (SQL 매퍼)
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.5'

	// Lombok (getter/setter 자동 생성, 컴파일 시에만 필요)
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// 개발 시 자동 재시작 (운영 환경에서는 제외됨)
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// AWS RDS MySQL 드라이버 (MariaDB에서 변경)
	runtimeOnly 'com.mysql:mysql-connector-j'

	// 테스트 라이브러리
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.5'
	testImplementation 'org.springframework.security:spring-security-test'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// AWS S3 파일 업로드
	implementation 'com.amazonaws:aws-java-sdk-s3:1.12.777'

	// WebFlux (Gemini AI API 비동기 호출용)
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
}

// 테스트 실행 설정
tasks.named('test') {
	useJUnitPlatform()
}
